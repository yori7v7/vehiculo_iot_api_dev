name: Validación backend — integración de dispositivo

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Pruebas completas del backend (sin AWS ni RDS)
        env:
          APP_ENV: development
          CONTROL_PUBLICO_ENABLED: 'false'
          CONTROL_PUBLICO_SIMULATION: 'false'
          DEVICE_LAB_ENABLED: 'false'
        run: python -m pytest tests -q
