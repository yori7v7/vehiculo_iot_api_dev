name: K-X V2 targeted recovery regression (CI fake only)
on:
  push:
    branches:
      - feature/kx-sidecar-windows-preparacion
    paths:
      - scripts/kx_v2_recovery_targeted_ci_lab.ps1
      - scripts/kx_prod_recoverer_v2_LOCKED.ps1
      - scripts/kx_prod_cutover_controller_v2_LOCKED.ps1
      - .github/workflows/kx-v2-recovery-regression-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-v2-crash-regression:
    runs-on: windows-latest
    timeout-minutes: 9
    steps:
      - name: Checkout isolated V2
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Windows PS5.1 parser and no production entrypoint check
        shell: powershell
        run: |
          $p='.\scripts\kx_v2_recovery_targeted_ci_lab.ps1'
          $tokens=$null;$errors=$null
          $ast=[Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -ne 0){
            $errors|ForEach-Object{Write-Host ('PARSE: '+$_.Message)}
            throw 'K-X V2 targeted regression syntax failed'
          }
          $source=Get-Content -LiteralPath $p -Raw
          foreach($must in @('RUNNER_TEMP','GITHUB_ACTIONS','FunctionDefinitionAst','KX-PerformRecovery','KX-StopOnlyTrackedCaddy','transaction.json.next')){
            if(-not $source.Contains($must)){throw ('Required isolated test scope missing: '+$must)}
          }
          Write-Host 'K-X V2 regression PowerShell 5.1 parser and CI-only guard PASS'
      - name: Exercise real V2 helper functions against fake data and mocked OS
        shell: powershell
        run: |
          $ps51=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $ps51 -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.\scripts\kx_v2_recovery_targeted_ci_lab.ps1'
          $code=$LASTEXITCODE
          if($code -ne 0){throw ('K-X V2 targeted regression NO-GO: '+$code)}
          Write-Host 'K-X V2 targeted regression PASS (isolated CI)'
