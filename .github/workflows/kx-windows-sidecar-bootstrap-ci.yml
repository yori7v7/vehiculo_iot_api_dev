name: K-X Windows service bootstrap static validation
on:
  push:
    branches:
      - feature/kx-sidecar-windows-preparacion
    paths:
      - scripts/kx_install_virtual_sidecar_loopback.ps1
      - scripts/kx_rollback_virtual_sidecar_loopback.ps1
      - scripts/kx_validate_virtual_sidecar_restart.ps1
      - scripts/kx_enable_virtual_sidecar_boot.ps1
      - scripts/kx_install_bootstrap_helper.ps1
      - scripts/kx_caddy_offline_candidate.ps1
      - scripts/kx_caddy_loopback_header_route_lab.ps1
      - scripts/kx_caddy_release_preflight_readonly_http.ps1
      - scripts/kx_caddy_restore_copy_rehearsal.ps1
      - scripts/kx_admin_get_local_contract_readonly_http.ps1
      - scripts/kx_caddy_real_kv_local_get_lab.ps1
      - scripts/kx_https_publication_readiness_inventory.ps1
      - scripts/kx_caddy_launcher_autosave_readonly.ps1
      - scripts/kx_caddy_launcher_acl_diagnosis_readonly.ps1
      - scripts/kx_caddy_xdg_autosave_readonly.ps1
      - scripts/kx_runtime_proxy_proof_local_lab.ps1
      - scripts/kx_caddy_stale_autosave_secret_exposure_readonly.ps1
      - scripts/kx_rotate_virtual_proxy_proof_remove_stale_autosave.ps1
      - scripts/kx_file_replace_dummy_acl_diagnostic.ps1
      - .github/workflows/kx-windows-sidecar-bootstrap-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell 5.1 and compile C-sharp interop
        shell: powershell
        run: |
          $file = "scripts/kx_install_virtual_sidecar_loopback.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "PowerShell syntax invalid"
          }
          $content = Get-Content $file -Raw
          $pattern = '(?s)Add-Type -Language CSharp -TypeDefinition @''\s+?(.*?)\s+''@'
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) { throw "C-sharp heredoc missing" }
          Add-Type -TypeDefinition $match.Groups[1].Value -Language CSharp -ErrorAction Stop
          Write-Host "PASS: PS5.1 AST and C-sharp"
      - name: Compile embedded Python and inspect safety contract
        shell: powershell
        run: |
          $content = Get-Content scripts/kx_install_virtual_sidecar_loopback.ps1 -Raw
          $pattern = '(?s)\$py=@''\s+?(.*?)\s+''@'
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) { throw "Launcher heredoc missing" }
          $launcher = Join-Path $env:RUNNER_TEMP "kx_virtual_launcher.py"
          [IO.File]::WriteAllText($launcher, $match.Groups[1].Value, [Text.Encoding]::UTF8)
          & python -B -m py_compile $launcher
          if ($LASTEXITCODE -ne 0) { throw "Python syntax invalid" }
          foreach ($required in @("127.0.0.1", "9444", "create_kv_virtual_app", "virtual_loopback_only", "proxy_headers=False")) {
            if (-not $match.Groups[1].Value.Contains($required)) { throw "Required safety marker missing" }
          }
          Write-Host "PASS: Python syntax and virtual-only contract"
      - name: Parse independent rollback and compile its interop
        shell: powershell
        run: |
          $file = "scripts/kx_rollback_virtual_sidecar_loopback.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "Rollback PowerShell syntax invalid"
          }
          $content = Get-Content $file -Raw
          $pattern = '(?s)Add-Type -Language CSharp -TypeDefinition @''\s+?(.*?)\s+''@'
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) { throw "Rollback interop missing" }
          Add-Type -TypeDefinition $match.Groups[1].Value -Language CSharp -ErrorAction Stop
          Write-Host "PASS: independent rollback syntax and C-sharp"
      - name: Parse sidecar restart and fencing test for PowerShell 5.1
        shell: powershell
        run: |
          $file = "scripts/kx_validate_virtual_sidecar_restart.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "PowerShell validation script syntax invalid"
          }
          $text = Get-Content $file -Raw
          foreach($required in @("Stop-ScheduledTask", "Start-ScheduledTask", "127.0.0.1:9444", "turno_activo", "canDrive", "401", "GetOwnerSid")) {
            if(-not $text.Contains($required)) { throw "Missing restart test contract: $required" }
          }
          if ($text -match '(?im)^\s*\$home\s*=') {
            throw "Do not assign reserved PowerShell variable HOME"
          }
          if ($text -match '\$response\.Data\.turno_virtual_activo') {
            throw "Wrong HTTP shape: backend exposes turno_activo"
          }
          if (-not $text.Contains('$serviceDir')) {
            throw "Expected independent service directory variable"
          }
          if (-not $text.Contains('$response.Data.turno_activo')) {
            throw "Missing correct HTTP admin snapshot field"
          }
          if (-not $text.Contains('$PSBoundParameters.ContainsKey("payload")')) {
            throw "GET/body regression: payload binding guard missing"
          }
          if ($text.Contains('if($null -ne $payload)')) {
            throw "GET/body regression: typed string default null is unsafe"
          }
          if (-not $text.Contains('Autorizacion virtual revocada tras NO-GO')) {
            throw "Virtual approval cleanup missing"
          }
          function Test-OptionalPayload([string]$payload = $null) {
            return $PSBoundParameters.ContainsKey("payload")
          }
          if (Test-OptionalPayload) { throw "Omitted body mistaken as supplied" }
          if (-not (Test-OptionalPayload -payload '{"modo":"timed"}')) {
            throw "Explicit POST body omitted"
          }
          Write-Host "PASS: GET body guard, optional param semantics and fail-closed cleanup"
          Write-Host "PASS: safe PowerShell variable names and backend API response contract"
          Write-Host "PASS: sidecar restart and epoch fencing script syntax"
      - name: Parse auto-start trigger guard in Windows PowerShell 5.1
        shell: powershell
        run: |
          $file = "scripts/kx_enable_virtual_sidecar_boot.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "PowerShell K-X auto-start script syntax invalid"
          }
          $source = Get-Content $file -Raw
          foreach ($marker in @("New-ScheduledTaskTrigger -AtStartup", "Set-ScheduledTask", "Disable-ScheduledTask", "boot_recovery_verified", "loopback_only_not_public", "original_caddy_sha256")) {
            if (-not $source.Contains($marker)) {
              throw "K-X auto-start contract missing: $marker"
            }
          }
          if ($source -match '(?im)^\s*\$home\s*=') { throw "Reserved HOME assignment" }
          if ($source -match '(?im)^\s*(Restart-Computer|Stop-Computer|Set-NetFirewallRule|New-NetFirewallRule)\b') {
            throw "Unsafe side effect in auto-start validator"
          }
          $boot = New-ScheduledTaskTrigger -AtStartup
          if ($boot.CimClass.CimClassName -notlike '*BootTrigger' -or $boot.Enabled -ne $true) {
            throw "Windows startup trigger object differs from expected shape"
          }
          Write-Host "PASS: Windows provides enabled BootTrigger contract"
          if ($source.Contains('Principal.UserId.EndsWith')) {
            throw "Principal check must not rely on display name"
          }
          if (-not $source.Contains('SID real del principal coincide')) {
            throw "Expected SID-based identity comparison"
          }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $fromName = ([Security.Principal.NTAccount]::new($identity.Name)).Translate(
            [Security.Principal.SecurityIdentifier]
          ).Value
          $fromSid = ([Security.Principal.SecurityIdentifier]::new($identity.User.Value)).Value
          if ($fromName -ne $fromSid) { throw "SID name translation mismatch" }
          Write-Host "PASS: SID name and string identity resolution"
          Write-Host "PASS: auto-start PowerShell syntax, guarded preconditions, no reboot"
      - name: Parse SYSTEM boot helper and embedded worker on Windows PowerShell 5.1
        shell: powershell
        run: |
          $script = "scripts/kx_install_bootstrap_helper.ps1"
          $tok = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tok, [ref]$errors) | Out-Null
          if (@($errors).Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "SYSTEM boot helper failed to parse"
          }
          $source = Get-Content $script -Raw
          $match = [regex]::Match($source, '(?s)\$worker=@''\s+?(.*?)\s+''@')
          if (-not $match.Success) { throw "Missing embedded worker" }
          $worker = Join-Path $env:RUNNER_TEMP "kx_boot_worker.ps1"
          [IO.File]::WriteAllText($worker,$match.Groups[1].Value,[Text.Encoding]::UTF8)
          $tok = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($worker,[ref]$tok,[ref]$errors) | Out-Null
          if (@($errors).Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "Embedded SYSTEM worker failed to parse"
          }
          foreach ($required in @("Register-ScheduledTask", "-User ""SYSTEM""", "New-ScheduledTaskTrigger -AtStartup", "Start-ScheduledTask", "Unregister-ScheduledTask", "127.0.0.1", "physical_control_enabled")) {
            if (-not $source.Contains($required) -and -not $match.Groups[1].Value.Contains($required)) {
              throw "Missing safety invariant $required"
            }
          }
          if ($source -match '(?im)^\s*\$home\s*=') { throw "Reserved HOME assignment" }
          $trigger = New-ScheduledTaskTrigger -AtStartup -RandomDelay (New-TimeSpan -Seconds 15)
          if ($trigger.CimClass.CimClassName -notlike "*BootTrigger") { throw "Expected BootTrigger" }
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 2) -MultipleInstances IgnoreNew
          if (-not $settings) { throw "Missing task settings" }
          Write-Host "PASS: bootstrap installer and SYSTEM worker PowerShell 5.1 syntax"
      - name: Parse Caddy offline candidate script on Windows PowerShell 5.1
        shell: powershell
        run: |
          $file = "scripts/kx_caddy_offline_candidate.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "Caddy offline candidate PS5.1 script syntax invalid"
          }
          $source = Get-Content $file -Raw
          $match = [regex]::Match($source, '(?s)\$candidate = @''\s+?(.*?)\s+''@')
          if (-not $match.Success) { throw "Caddyfile candidate heredoc missing" }
          $candidate = $match.Groups[1].Value
          foreach ($required in @("handle @kv_virtual", "reverse_proxy 127.0.0.1:8000", "reverse_proxy 127.0.0.1:9444", "header_up -X-Forwarded-For", "header_up -X-Forwarded-Proto", "X-Admission-Client-IP", "OFFLINE_INVALID_TOKEN_NOT_FOR_DEPLOYMENT", "100-30-4-62.nip.io")) {
            if (-not $candidate.Contains($required)) { throw "Missing candidate safety marker: $required" }
          }
          if ($candidate.Contains("{$")) { throw "Unbound Caddy env-var placeholder" }
          if ($source -match '(?im)^\s*(Restart-Service|Restart-Computer|Stop-Computer|Set-ScheduledTask|New-NetFirewallRule|caddy reload)\b') {
            throw "Unexpected production mutation in offline candidate"
          }
          if ($source -match '(?im)^\s*\$home\s*=') { throw "Reserved PowerShell HOME assignment" }
          Write-Host "PASS: offline Caddy candidate PowerShell AST and safety markers"
      - name: Parse loopback Caddy route lab and embedded Python
        shell: powershell
        run: |
          $file = "scripts/kx_caddy_loopback_header_route_lab.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "PowerShell loopback lab syntax invalid"
          }
          $source = Get-Content $file -Raw
          $match = [regex]::Match($source, '(?s)\$echoSrc=@''\s+?(.*?)\s+''@')
          if (-not $match.Success) { throw "Embedded Python echo heredoc missing" }
          $echo = Join-Path $env:RUNNER_TEMP "kx_lab_echo.py"
          [IO.File]::WriteAllText($echo,$match.Groups[1].Value,[Text.Encoding]::UTF8)
          & python -B -m py_compile $echo
          if($LASTEXITCODE -ne 0){throw "Echo Python code invalid"}
          foreach ($require in @("Port 9481", "Port 9482", "Port 9483",
                "http://127.0.0.1:9481", "admin off",
                "reverse_proxy 127.0.0.1:9482",
                "reverse_proxy 127.0.0.1:9483",
                "ATTACKER_TOKEN", "X-Forwarded-For",
                "OFFLINE_INVALID_TOKEN_NOT_FOR_DEPLOYMENT",
                "Stop-Process", "Get-FileHash", "NO ACTIVAR CADDY CANDIDATO")) {
            if(-not $source.Contains($require)){
              throw "Loopback lab safety assertion missing: $require"
            }
          }
          if ($source -match '(?im)^\s*\$home\s*=') { throw "Reserved HOME assignment" }
          if ($source -match '(?im)^\s*(Restart-Computer|Restart-Service|Set-ScheduledTask|New-NetFirewallRule)\b') {
            throw "Disallowed state mutation in ephemeral lab"
          }
          if (-not $source.Contains(' bind 127.0.0.1')) { throw "Missing explicit Caddy loopback bind" }
          if (-not $source.Contains('DIAGNOSTICO CADDY:')) { throw "Missing sanitized Caddy startup diagnostics" }
          if (-not $source.Contains('$python -B -m py_compile $echoFile')) { throw "Unsafe Python syntax-check command; use py_compile" }
          if ($source.Contains('ast.parse(open(')) { throw "Legacy quoted inline Python still present" }
          Write-Host "PASS: Caddy header/route lab syntax and embedded echo server"
      - name: Parse K-X release preflight and safe negative GET probes
        shell: powershell
        run: |
          $file = "scripts/kx_caddy_release_preflight_readonly_http.ps1"
          $tok = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tok,[ref]$errors) | Out-Null
          if (@($errors).Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "Preflight PowerShell 5.1 syntax invalid"
          }
          $source = Get-Content $file -Raw
          foreach($marker in @("Export-ScheduledTask", "Get-FileHash",
            "127.0.0.1:9444", "Probe-Denial", "CONTROL FISICO", "NO-GO",
            "CacheControl.NoStore", "new_public_routes_activated", "rollback_execution_tested",
            "GetOwnerSid", "Get-NetTCPConnection", "icacls.exe")) {
            if(-not $source.Contains($marker)) { throw "Missing preflight safety marker: $marker" }
          }
          foreach($illegal in @("Set-ScheduledTask", "Register-ScheduledTask", "caddy reload",
            "Restart-Service", "Restart-Computer", "New-NetFirewallRule", "Set-NetFirewallRule")) {
            if($source.Contains($illegal)) { throw "Unexpected live mutation: $illegal" }
          }
          if($source -match '(?im)^\s*\$home\s*=') { throw "Reserved PowerShell HOME assignment" }
          Write-Host "PASS: preflight PowerShell AST and no-publication guards"
      - name: Parse safe Caddy recovery-copy rehearsal in Windows PowerShell
        shell: powershell
        run: |
          $file = "scripts/kx_caddy_restore_copy_rehearsal.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "Copy-only restore rehearsal does not parse under PowerShell 5.1"
          }
          $source = Get-Content $file -Raw
          foreach ($required in @("Caddyfile.original.copy",
              "Caddyfile.restored.copy", "Caddyfile.kx.offline",
              "OFFLINE_INVALID_TOKEN_NOT_FOR_DEPLOYMENT",
              "Get-FileHash", "Start-Process", "adapt --config",
              "actual_service_rollback_tested", "new_public_routes_enabled",
              "physical_control_enabled", "CADDY ADAPT SOBRE COPIA: PASS",
              "Get-ScheduledTask", "icacls.exe")) {
            if (-not $source.Contains($required)) {
              throw "Offline drill missing safety contract: $required"
            }
          }
          foreach ($forbidden in @("Register-ScheduledTask",
               "Set-ScheduledTask", "Restart-Computer", "Restart-Service",
               "New-NetFirewallRule", "caddy reload", "Invoke-WebRequest")) {
            if ($source.Contains($forbidden)) {
              throw "Offline rehearsal contains forbidden mutation: $forbidden"
            }
          }
          if($source -match '(?im)^\s*\$home\s*=') { throw "PowerShell HOME reserved variable" }
          Write-Host "PASS: no-reload, copy-only rollback rehearsal script parses and preserves safety contracts"
      - name: Parse K-X guarded authenticated local GET and no-active-ticket precheck
        shell: powershell
        run: |
          $file = "scripts/kx_admin_get_local_contract_readonly_http.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
          if(@($errors).Count -ne 0) {
            $errors | ForEach-Object {Write-Host $_.Message}
            throw "K-X admin GET script invalid under PowerShell 5.1"
          }
          $source = Get-Content $file -Raw
          $match = [regex]::Match($source, '(?s)\$pythonCode = @''\s+?(.*?)\s+''@')
          if(-not $match.Success){throw "Missing Python read-only DB precheck"}
          $probe = Join-Path $env:RUNNER_TEMP "kx_active_tickets_check.py"
          [IO.File]::WriteAllText($probe,$match.Groups[1].Value,[Text.Encoding]::UTF8)
          & python -B -m py_compile $probe
          if($LASTEXITCODE -ne 0){throw "Invalid embedded sqlite Python code"}
          foreach($required in @("SELECT COUNT(*) FROM kr_ticket",
             "mode=ro", "PRAGMA query_only=ON", "Sin tickets",
             "Test-LocalGET", "ADMIN_VALIDO", "FORWARDED_FALSO",
             "PROXY_INVALIDO", "SIN_CLAVE_ADMIN", "HTTP 200",
             "GetOwnerSid", "CacheControl.NoStore",
             "physical_control_enabled", "NO REPETIR NI MODIFICAR CADDY",
             "ADMIN GET K-V LOCAL CERTIFICADO")) {
            if(-not $source.Contains($required)){
              throw "Missing read-only GET security contract: $required"
            }
          }
          foreach($forbidden in @("Register-ScheduledTask","Set-ScheduledTask",
             "Restart-Computer","Restart-Service","New-NetFirewallRule",
             "caddy reload", "Invoke-WebRequest")) {
            if($source.Contains($forbidden)){throw "Forbidden action in GET script: $forbidden"}
          }
          if($source -match '(?im)^\s*\$home\s*=') {throw "Reserved PowerShell HOME assignment"}
          Write-Host "PASS: guarded local GET script, no-active-ticket Python check, and anti-spoofing cases"
      - name: Parse ephemeral Caddy to K-V real GET test and memory-only proof
        shell: powershell
        run: |
          $file = "scripts/kx_caddy_real_kv_local_get_lab.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
          if(@($errors).Count -ne 0) {
            $errors | ForEach-Object {Write-Host $_.Message}
            throw "Caddy -> K-V real GET lab script invalid under PowerShell 5.1"
          }
          $source = Get-Content $file -Raw
          $match = [regex]::Match($source, '(?s)\$pyCode=@''\s+?(.*?)\s+''@')
          if(-not $match.Success){throw "Missing embedded SQLite precheck"}
          $probe = Join-Path $env:RUNNER_TEMP "kx_real_caddy_precheck.py"
          [IO.File]::WriteAllText($probe,$match.Groups[1].Value,[Text.Encoding]::UTF8)
          & python -B -m py_compile $probe
          if($LASTEXITCODE -ne 0){throw "Invalid embedded Python sqlite precheck"}
          foreach($required in @("mode=ro", "PRAGMA query_only=ON",
            "SELECT COUNT(*) FROM kr_ticket",
            "admin off", " bind 127.0.0.1",
            'Join([Environment]::NewLine,@("{"," admin off","}",""))',
            'header_up X-Admission-Client-IP 1.1.1.1',
            '{$KX_STAGING_PROXY_PROOF}', "VISITOR_FALSE_TOKEN",
            "reverse_proxy 127.0.0.1:9444", "respond 404",
            "Caddy publico sigue escuchando 443",
            "Wait-Local 9481", "Stop-Process", "Get-FileHash",
            "ADMIN_VALIDO_POR_CADDY","ADMIN_SIN_CLAVE_POR_CADDY",
            "ADMIN_CLAVE_FALSA_POR_CADDY", "ORIGIN_FALSO_POR_CADDY",
            "HEADERS_SPOOFED_FILTRADOS",
            "CABECERA DE IP PUBLICA: SIMULADA, NO PROBADA EN INTERNET",
            "production_caddy_modified", "GetOwnerSid")) {
            if(-not $source.Contains($required)) {
              throw "Missing local real-KV lab safety requirement: $required"
            }
          }
          foreach($forbidden in @("Register-ScheduledTask", "Set-ScheduledTask",
            "Restart-Computer", "Restart-Service", "New-NetFirewallRule",
            "caddy reload", "Invoke-WebRequest")) {
            if($source.Contains($forbidden)){throw "Forbidden production change in lab: $forbidden"}
          }
          if($source -match '(?im)^\s*\$home\s*=') {throw "Reserved PowerShell HOME variable"}
          Write-Host "PASS: ephemeral Caddy to real virtual K-V GET lab and memory-only proof"
      - name: Parse K-X HTTPS read-only publication readiness inventory in Windows
        shell: powershell
        run: |
          $file = "scripts/kx_https_publication_readiness_inventory.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
          if(@($errors).Count -ne 0) {
            $errors | ForEach-Object {Write-Host $_.Message}
            throw "HTTPS inventory invalid under Windows PowerShell 5.1"
          }
          $source = Get-Content $file -Raw
          foreach($required in @("Get-ScheduledTask", "Get-NetTCPConnection",
            "GetOwnerSid", "Get-FileHash", "original_caddy_sha256",
            "kx_real_caddy_local_contract.json", "Caddyfile.original.copy",
            "LOGON TYPE CADDY", "IDENTIDAD PROCESO CADDY",
            "KX_STAGING_PROXY_PROOF", "LINEA DE COMANDOS EN PROCESO",
            "Get-Acl", "K-V: NO PUBLICADO",
            "PENDIENTE: MECANISMO DE INYECCION SEGURA",
            "CONTROL FISICO: OFF")) {
              if(-not $source.Contains($required)){
                throw "HTTPS inventory missing safety marker: $required"
              }
          }
          foreach($forbidden in @("Set-ScheduledTask", "Register-ScheduledTask",
            "Restart-Computer", "Restart-Service", "New-NetFirewallRule",
            "caddy reload", "Invoke-WebRequest", "Set-Content",
            "Out-File", "Remove-Item")) {
              if($source.Contains($forbidden)){throw "Unsafe mutation in read-only inventory: $forbidden"}
          }
          if($source -match '(?im)^\s*\$home\s*=') {throw "Reserved PowerShell HOME variable"}
          Write-Host "PASS: read-only HTTPS publication inventory syntax and fail-closed safety contracts"
      - name: Parse K-X Caddy launcher and autosave READ ONLY security inventory
        shell: powershell
        run: |
          $file = "scripts/kx_caddy_launcher_autosave_readonly.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
          if(@($errors).Count -gt 0){
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "K-X launcher and autosave audit invalid under Windows PowerShell 5.1"
          }
          $src = Get-Content $file -Raw
          foreach($required in @("Export-ScheduledTask", "Get-Ps1Path", "Get-FileHash",
            "PowerShell", "GetOwnerSid", "Get-NetTCPConnection",
            "System32\config\systemprofile\AppData\Roaming\Caddy\autosave.json",
            "Inspect-RiskyACL", "broad_write_entries", "CONTENIDO DEL LANZADOR: NO MOSTRADO",
            "ARGUMENTOS COMPLETOS: NO MOSTRADOS", "LANZADOR USA --RESUME",
            "AUTOSAVE RUTAS WINDOWS SYSTEM COMUNES", "Admin API Caddy",
