name: 55-K Bridge Native Safety Tests

on:
  push:
    branches:
      - feature/55k-actuacion-fisica-segura

permissions:
  contents: read

jobs:
  bridge-tests:
    name: Native C++ and Safety Regression
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile bridge tests
        run: |
          g++ -std=c++11 -O0 -Wall -Wextra -Werror \
            tests/55k_bridge_selftest.cpp \
            -o "$RUNNER_TEMP/55k_bridge_selftest"

      - name: Execute bridge tests
        run: |
          "$RUNNER_TEMP/55k_bridge_selftest"

      - name: Compile original shadow tests
        run: |
          g++ -std=c++11 -O0 -Wall -Wextra -Werror \
            tests/55k_shadow_selftest.cpp \
            -o "$RUNNER_TEMP/55k_shadow_selftest"

      - name: Execute original shadow tests
        run: |
          "$RUNNER_TEMP/55k_shadow_selftest"

      - name: Verify original safety contracts
        run: |
          python3 -m unittest discover \
            -s tests \
            -p "test_55k_guardrails.py" \
            -v

      - name: Verify signed authority to firmware contract
        run: |
          python3 -m unittest discover \
            -s tests \
            -p "test_55k_auth_chain.py" \
            -v

      - name: Compile and execute protected output adapter
        run: |
          g++ -std=c++11 -O0 -Wall -Wextra -Werror \
            tests/55k_output_selftest.cpp \
            -o "$RUNNER_TEMP/55k_output_selftest"
          "$RUNNER_TEMP/55k_output_selftest"

      - name: Verify physical mode remains locked
        run: |
          if g++ -std=c++11 -fsyntax-only \
            -DETAPA55K_SALIDA_FISICA=1 \
            tests/55k_output_selftest.cpp \
            2> "$RUNNER_TEMP/55k_guard.log"; then
            echo "NO-GO: Physical mode unexpectedly compiled"
            exit 1
          fi
          grep -F \
            "55-K: actuacion fisica requiere revision y autorizacion." \
            "$RUNNER_TEMP/55k_guard.log"
          echo "GO: Physical compile guard remains active"

      - name: Compile and execute physical candidate simulation
        run: |
          g++ -std=c++11 -O0 -Wall -Wextra -Werror \
            tests/55k_physical_candidate_selftest.cpp \
            -o "$RUNNER_TEMP/55k_physical_candidate_selftest"
          "$RUNNER_TEMP/55k_physical_candidate_selftest"
      - name: Verify isolated signed auxiliary protocol
        run: |
          python3 -m unittest discover -s tests -p "test_55k_aux_wire.py" -v

      - name: Verify equal control permissions for admin and guest
        run: |
          python3 -m unittest discover \
            -s tests \
            -p "test_55k_control_permissions.py" \
            -v

      - name: Verify server-backed K-R control permissions
        run: |
          python3 -m unittest discover \
            -s tests \
            -p "test_55k_ledger_evidence.py" \
            -v
      - name: Verify virtual K-X role authorization wiring
        run: |
          python3 -m unittest discover             -s tests             -p "test_55k_kx_role_link.py"             -v

  role-integration:
    name: Virtual WSS Role Integration
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install integration test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "fastapi==0.143.1" \
            "pydantic==2.14.1" \
            "pytest==9.1.1" \
            "httpx>=0.27,<1" \
            "httpx2"

      - name: Execute existing and new WSS integration tests
        run: |
          python -m pytest -v -x \
            -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/55k_pytest" \
            tests/test_kv_kx_virtual_bridge_lab.py \
            tests/test_55k_kx_dynamic_roles.py

      - name: Verify virtual programmed DEMO planner
        run: |
          python -m unittest discover -s tests -p "test_55k_demo_programada.py" -v

      - name: Verify programmed DEMO through virtual signed WSS
        run: |
          python -m pytest -v -x \
            -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/55k_demo_wss" \
            tests/test_55k_demo_wss_integration.py

      - name: Verify shared-authority DEMO coordinator
        run: |
          python -m pytest -v -x \
            -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/55k_demo_coordinator" \
            tests/test_55k_demo_coordinator.py

      - name: Audit DEMO disconnection expiration and cancellation
        run: |
          python -m pytest -v -x \
            -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/55k_failure_audit" \
            tests/test_55k_demo_failure_audit.py

      - name: Verify DEMO restart and no automatic resume
        run: |
          python -m pytest -v -x \
            -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/55k_demo_restart" \
            tests/test_55k_demo_restart.py

      - name: Verify priority virtual STOP during programmed DEMO
        run: |
          python -m pytest -v -x \
            -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/55k_demo_priority_stop" \
            tests/test_55k_demo_priority_stop.py

      - name: Verify safe virtual DEMO monitoring snapshot
        run: |
          python -m pytest -v -x \
            -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/55k_demo_monitoring" \
            tests/test_55k_demo_monitoring.py
