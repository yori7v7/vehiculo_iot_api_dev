name: 55-K Bridge Native Safety Tests

on:
  push:
    branches:
      - feature/55k-actuacion-fisica-segura

permissions:
  contents: read

jobs:
  bridge-tests:
    name: Native C++ and Safety Regression
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile bridge tests
        run: |
          g++ -std=c++11 -O0 -Wall -Wextra -Werror \
            tests/55k_bridge_selftest.cpp \
            -o "$RUNNER_TEMP/55k_bridge_selftest"

      - name: Execute bridge tests
        run: |
          "$RUNNER_TEMP/55k_bridge_selftest"

      - name: Compile original shadow tests
        run: |
          g++ -std=c++11 -O0 -Wall -Wextra -Werror \
            tests/55k_shadow_selftest.cpp \
            -o "$RUNNER_TEMP/55k_shadow_selftest"

      - name: Execute original shadow tests
        run: |
          "$RUNNER_TEMP/55k_shadow_selftest"

      - name: Verify original safety contracts
        run: |
          python3 -m unittest discover \
            -s tests \
            -p "test_55k_guardrails.py" \
            -v

      - name: Verify signed authority to firmware contract
        run: |
          python3 -m unittest discover \
            -s tests \
            -p "test_55k_auth_chain.py" \
            -v

      - name: Compile and execute protected output adapter
        run: |
          g++ -std=c++11 -O0 -Wall -Wextra -Werror \
            tests/55k_output_selftest.cpp \
            -o "$RUNNER_TEMP/55k_output_selftest"
          "$RUNNER_TEMP/55k_output_selftest"

      - name: Verify physical mode remains locked
        run: |
          if g++ -std=c++11 -fsyntax-only \
            -DETAPA55K_SALIDA_FISICA=1 \
            tests/55k_output_selftest.cpp \
            2> "$RUNNER_TEMP/55k_guard.log"; then
            echo "NO-GO: Physical mode unexpectedly compiled"
            exit 1
          fi
          grep -F \
            "55-K: actuacion fisica requiere revision y autorizacion." \
            "$RUNNER_TEMP/55k_guard.log"
          echo "GO: Physical compile guard remains active"

      - name: Compile and execute physical candidate simulation
        run: |
          g++ -std=c++11 -O0 -Wall -Wextra -Werror \
            tests/55k_physical_candidate_selftest.cpp \
            -o "$RUNNER_TEMP/55k_physical_candidate_selftest"
          "$RUNNER_TEMP/55k_physical_candidate_selftest"
