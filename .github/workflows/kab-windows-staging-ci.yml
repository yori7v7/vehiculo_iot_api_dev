name: K-AB staging virtual Windows con permisos y rollback (CI)
on:
  push:
    branches:
      - feature/5-5a-dispositivo-protocolo-aislado
  workflow_dispatch:
permissions:
  contents: read

jobs:
  staging-sidecar:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout de rama experimental
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar solo dependencias de CI
        run: python -m pip install -r requirements-dev.txt
      - name: Preflight LocalService, activación y rollback independientes
        shell: powershell
        run: |
          .\tests\kab_windows_staging_ci.ps1
          if ($LASTEXITCODE -ne 0) { throw 'K-AB NO-GO: staging no validado' }
