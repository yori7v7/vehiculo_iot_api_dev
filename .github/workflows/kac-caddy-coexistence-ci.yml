name: K-AC Caddy candidato y rollback HTTPS aislados
on:
  push:
    branches:
      - feature/5-5a-dispositivo-protocolo-aislado
  workflow_dispatch:
permissions:
  contents: read

jobs:
  candidate-and-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout experimental sin Git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Requisitos FastAPI virtual
        run: python -m pip install -r requirements-dev.txt
      - name: Preparar TLS y secretos FICTICIOS sólo para runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kac/ca" "$RUNNER_TEMP/kac/tls" "$RUNNER_TEMP/kac/private"
          chmod 700 "$RUNNER_TEMP/kac" "$RUNNER_TEMP/kac/"{ca,tls,private}
          echo "KAC_ROOT_CA=$RUNNER_TEMP/kac/ca/ca.crt" >> "$GITHUB_ENV"
          echo "KW_ROOT_CA=$RUNNER_TEMP/kac/ca/ca.crt" >> "$GITHUB_ENV"
          echo "KW_PRIVATE_DB=$RUNNER_TEMP/kac/private/ledger.sqlite3" >> "$GITHUB_ENV"
          echo "KW_TEST_LAB=isolated-loopback-only" >> "$GITHUB_ENV"
          echo "APP_ENV=staging" >> "$GITHUB_ENV"
          echo "ADMISSION_VIRTUAL_ONLY=enabled" >> "$GITHUB_ENV"
          admin="$(openssl rand -hex 32)"
          proxy="$(openssl rand -hex 32)"
          echo "::add-mask::$admin"
          echo "::add-mask::$proxy"
          echo "KW_ADMIN_TEST_KEY=$admin" >> "$GITHUB_ENV"
          echo "KW_PROXY_TEST_KEY=$proxy" >> "$GITHUB_ENV"
          echo "KW_PROXY_TOKEN=$proxy" >> "$GITHUB_ENV"
          openssl req -x509 -new -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/kac/ca/ca.key" \
            -out "$RUNNER_TEMP/kac/ca/ca.crt" \
            -subj "/CN=KAC-CI-Temporary-CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/kac/tls/server.key" \
            -out "$RUNNER_TEMP/kac/tls/server.csr" \
            -subj "/CN=100-30-4-62.nip.io" \
            -addext "subjectAltName=DNS:100-30-4-62.nip.io"
          printf 'basicConstraints=critical,CA:FALSE\nsubjectAltName=DNS:100-30-4-62.nip.io\nextendedKeyUsage=serverAuth\nkeyUsage=critical,digitalSignature,keyEncipherment\n' \
            > "$RUNNER_TEMP/kac/tls/server.ext"
          openssl x509 -req -days 1 -sha256 \
            -in "$RUNNER_TEMP/kac/tls/server.csr" \
            -CA "$RUNNER_TEMP/kac/ca/ca.crt" \
            -CAkey "$RUNNER_TEMP/kac/ca/ca.key" \
            -CAcreateserial \
            -out "$RUNNER_TEMP/kac/tls/server.crt" \
            -extfile "$RUNNER_TEMP/kac/tls/server.ext"
          openssl verify -CAfile "$RUNNER_TEMP/kac/ca/ca.crt" "$RUNNER_TEMP/kac/tls/server.crt"
          sudo chown -R 0:0 "$RUNNER_TEMP/kac/tls"
          sudo chmod 700 "$RUNNER_TEMP/kac/tls"
          sudo chmod 600 "$RUNNER_TEMP/kac/tls/server.key"
          sudo chmod 644 "$RUNNER_TEMP/kac/tls/server.crt"
          python -m scripts.kac_ci_prepare_caddy --output "$RUNNER_TEMP/kac"

      - name: Validar ambos Caddyfiles efímeros sin red
        shell: bash
        run: |
          set -euo pipefail
          for version in candidate rollback; do
            docker run --rm --network none \
              -v "$RUNNER_TEMP/kac/$version.caddy:/etc/caddy/Caddyfile:ro" \
              -v "$RUNNER_TEMP/kac/tls:/lab:ro" \
              -e KW_PROXY_TOKEN="$KW_PROXY_TOKEN" \
              caddy:2.10.2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done

      - name: FastAPI virtual aislado y legacy HTTP sintético
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.servidor_55kw_ci > "$RUNNER_TEMP/kac/virtual.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/kac/virtual.pid"
          python -m scripts.kac_ci_legacy_stub > "$RUNNER_TEMP/kac/legacy.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/kac/legacy.pid"
          virtual_ready=0
          legacy_ready=0
          for i in $(seq 1 30); do
            v="$(curl -s --noproxy '*' --max-time 1 -o /dev/null -w '%{http_code}' http://127.0.0.1:9444/ || true)"
            l="$(curl -s --noproxy '*' --max-time 1 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/__kac_legacy_probe || true)"
            if [ "$v" = 404 ]; then virtual_ready=1; fi
            if [ "$l" = 200 ]; then legacy_ready=1; fi
            if [ "$virtual_ready" = 1 ] && [ "$legacy_ready" = 1 ]; then break; fi
            sleep 1
          done
          test "$virtual_ready" = 1 && test "$legacy_ready" = 1

      - name: Caddy real con ambos upstreams
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name kac-ci-proxy --network host --read-only \
            --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges \
            --tmpfs /data --tmpfs /config \
            -v "$RUNNER_TEMP/kac/candidate.caddy:/etc/caddy/Caddyfile:ro" \
            -v "$RUNNER_TEMP/kac/tls:/lab:ro" \
            -e KW_PROXY_TOKEN="$KW_PROXY_TOKEN" \
            caddy:2.10.2 caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          ready=0
          for i in $(seq 1 25); do
            result="$(curl -s --noproxy '*' --max-time 2 --cacert "$KAC_ROOT_CA" \
              --resolve 100-30-4-62.nip.io:9443:127.0.0.1 \
              -o /dev/null -w '%{http_code}' \
              https://100-30-4-62.nip.io:9443/__kac_legacy_probe || true)"
            if [ "$result" = 200 ]; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          python -m scripts.kac_ci_verify_roundtrip candidate

      - name: Pérdida del sidecar no corta legacy
        shell: bash
        run: |
          set -euo pipefail
          kill "$(cat "$RUNNER_TEMP/kac/virtual.pid")"
          for i in $(seq 1 15); do
            status="$(curl -s --noproxy '*' --max-time 1 -o /dev/null -w '%{http_code}' http://127.0.0.1:9444/ || true)"
            if [ "$status" = 000 ]; then break; fi
            sleep 1
          done
          python -m scripts.kac_ci_verify_roundtrip sidecar_off

      - name: Rollback del proxy a configuración legacy anterior
        shell: bash
        run: |
          set -euo pipefail
          # Simulación por REINICIO solo del Caddy Docker descartable.
          # NO es un ensayo de recarga sin corte del Caddy Windows de EC2.
          docker rm -f kac-ci-proxy > /dev/null
          docker run -d --name kac-ci-proxy --network host --read-only \
            --cap-drop ALL --cap-add NET_BIND_SERVICE --security-opt no-new-privileges \
            --tmpfs /data --tmpfs /config \
            -v "$RUNNER_TEMP/kac/rollback.caddy:/etc/caddy/Caddyfile:ro" \
            -v "$RUNNER_TEMP/kac/tls:/lab:ro" \
            caddy:2.10.2 caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          ready=0
          for i in $(seq 1 25); do
            status="$(curl -s --noproxy '*' --max-time 2 --cacert "$KAC_ROOT_CA" \
              --resolve 100-30-4-62.nip.io:9443:127.0.0.1 \
              -o /dev/null -w '%{http_code}' \
              https://100-30-4-62.nip.io:9443/__kac_legacy_probe || true)"
            if [ "$status" = 200 ]; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          python -m scripts.kac_ci_verify_roundtrip rollback

      - name: Eliminar los servidores y certificados de CI
        if: always()
        shell: bash
        run: |
          docker rm -f kac-ci-proxy >/dev/null 2>&1 || true
          for service in virtual legacy; do
            if [ -f "$RUNNER_TEMP/kac/$service.pid" ]; then
              kill "$(cat "$RUNNER_TEMP/kac/$service.pid")" 2>/dev/null || true
            fi
          done
          sudo rm -rf "$RUNNER_TEMP/kac"
